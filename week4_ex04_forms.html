<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Exercise</title>
    <style>
        body { font-family: sans-serif; margin: 40px; line-height: 1.6; }
        form { margin-bottom: 40px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        div { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="date"] { width: 100%; padding: 8px; margin-top: 5px; }
        button { padding: 10px 15px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>User Registration</h2>
    <form action="https://formspree.io/f/xpwzpzrd" method="POST">
        <div>
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>

        <div>
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>

        <div>
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male" style="display:inline;">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female" style="display:inline;">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other" style="display:inline;">Other</label>
        </div>

        <div>
            <label for="date_of_birth">Date of Birth:</label>
            <input type="date" id="date_of_birth" name="date_of_birth" required>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <button type="submit">Submit Registration</button>
    </form>

    <hr>

    <h2>Search Records</h2>
    <form action=" https://httpbin.org/get " method="GET">
        <div>
            <label for="search_name">Search by Name:</label>
            <input type="text" id="search_name" name="search_name" placeholder="Enter name to search...">
        </div>
        <button type="submit">Search</button>
    </form>

</body>
</html>
